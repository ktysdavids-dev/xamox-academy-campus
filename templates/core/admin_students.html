{% extends "base.html" %}{% block content %}<section class="page-shell"><div class="admin-head"><div><a class="back" href="{% url 'admin_dashboard' %}">← Administración</a><h1>Alumnos</h1></div><a class="btn primary" href="{% url 'admin_student_create' %}">+ Nuevo alumno</a></div><div class="panel">{% for student in students %}<a class="data-row" href="{% url 'admin_student_detail' student.id %}"><span><strong>{{ student.get_full_name|default:student.email }}</strong><small>{{ student.email }}</small></span><b>{{ student.enrollments.count }} matrículas</b></a>{% empty %}<p>No hay alumnos.</p>{% endfor %}</div></section>{% endblock %}
