[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/health/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
preDeployCommand = ["python manage.py migrate", "python manage.py collectstatic --noinput", "python manage.py seed_academy", "python manage.py bootstrap_admin"]
